# Turkish, and the fallback for any key en/texts.properties lacks. MessageFormat patterns: write an apostrophe as ''.

mail.coordinatorAccount.subject=menton koordinatör hesabınız hazır
mail.coordinatorAccount.body=Merhaba {0},\n\nmenton''da (ODTÜ Teknokent) sizin için bir koordinatör hesabı açıldı. Şifrenizi belirlemek için bu bağlantıyı açın:\n\n{1}\n\nŞifrenizi belirledikten sonra {2} adresinden giriş yapabilirsiniz. Bağlantının süresi dolarsa giriş sayfasındaki "Şifremi unuttum" ile yenisini isteyebilir ya da yöneticinizden e-postayı tekrar göndermesini isteyebilirsiniz.\n\nmenton
mail.coordinatorAssigned.subject=menton''da koordinatör olarak atandınız
mail.coordinatorAssigned.body=Merhaba {0},\n\nmenton''da (ODTÜ Teknokent) artık programları koordinatör olarak yönetebilirsiniz. Mevcut şifrenizle giriş yapabilirsiniz: {1}\n\nmenton
mail.programCoordinatorInvite.subject=menton''da "{0}" programının koordinatörü olarak davet edildiniz
mail.programCoordinatorInvite.body=Merhaba {0},\n\nmenton''da (ODTÜ Teknokent) "{1}" programına koordinatör olarak eklendiniz ve sizin için bir koordinatör hesabı açıldı.\n\nŞifrenizi belirlemek için bu bağlantıyı açın:\n\n{2}\n\nÖnemli: Bu bağlantı yalnızca bir kez kullanılabilir ve yaklaşık 1 saat sonra geçerliliğini yitirir. Süresi dolduysa {3} adresindeki giriş sayfasında "Şifremi unuttum"a tıklayın ve bu e-posta adresini yazın; size yeni bir bağlantı gönderilir. Programı oluşturan yöneticiden e-postayı tekrar göndermesini de isteyebilirsiniz.\n\nŞifrenizi belirledikten sonra {3} adresinden bu e-posta adresiyle giriş yapabilirsiniz.\n\nmenton
mail.mentorPoolInvite.subject=menton: {0} mentor havuzuna davet
mail.mentorPoolInvite.body=Merhaba,\n\n{0} programının mentor havuzuna davet edildiniz.\n\nKayıt bağlantınız (7 gün geçerli): {1}\n\nBu e-posta adresiyle kayıt olun; koordinatör onayladığında havuza eklenirsiniz.\n\nmenton
mail.passwordReset.subject=menton şifrenizi sıfırlayın
mail.passwordReset.body=Merhaba,\n\nmenton (ODTÜ Teknokent) hesabınız için şifre sıfırlama istendi. Yeni şifrenizi belirlemek için bu bağlantıyı açın:\n\n{0}\n\nBu isteği siz yapmadıysanız bu e-postayı yok sayabilirsiniz; şifreniz değişmez.\n\nmenton
mail.verifyEmail.subject=menton e-posta adresinizi doğrulayın
mail.verifyEmail.body=Merhaba,\n\nmenton''a (ODTÜ Teknokent) hoş geldiniz. Kaydınızı tamamlamak için e-posta adresinizi bu bağlantıyla doğrulayın:\n\n{0}\n\nBu kaydı siz yapmadıysanız bu e-postayı yok sayabilirsiniz.\n\nmenton
mail.newRequest.body=Merhaba {0},\n\n{1}\n\nTalebi görmek için: {2}\n\nMenton
mail.teamCode.subject=menton: {0} takım kodunuz
mail.teamCode.body=Merhaba,\n\n{0} programına {1} takımının yetkilisi olarak davet edildiniz.\n\nTakım kodunuz: {2}\n\n{3} adresinden bu kodla kayıt olun. Kayıt olduktan sonra aynı kodu ekip arkadaşlarınızla paylaşabilirsiniz.\n\nmenton

