server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    banner-mode: "off"
  log-startup-info: false
  application:
    name: backend

  # Errors and match reasons follow the caller's Accept-Language; without one they are Turkish.
  web:
    locale: tr

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 52MB

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:db}
    username: ${DATABASE_USERNAME:teknokent}
    password: ${DATABASE_PASSWORD:change-me}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  security:
    user:
      name: ${SECURITY_USERNAME}
      password: ${SECURITY_PASSWORD}
      # The frontend's service credential. Paths only the frontend may call check for this role
      # (SecurityConfig.SERVICE_ONLY_PATHS); no Menton account ever gets it.
      roles: SERVICE

  # One thread per @Scheduled job (transcript bots, reminders, user-deletion cleanup), so a slow tick of one does
  # not hold back the others. Each job is fixedDelay, so it still never overlaps itself.
  task:
    scheduling:
      pool:
        size: 3

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

logging:
  level:
    root: WARN
    org.springframework: WARN
    org.hibernate: WARN
    org.hibernate.type: WARN
    org.hibernate.engine: WARN
    org.hibernate.boot: WARN
    org.hibernate.validator: WARN
    org.hibernate.SQL: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
    com.zaxxer.hikari: WARN
    org.springdoc: ERROR
    org.springframework.boot: WARN
    com.dps.teknokent: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# The API map is public when on, so it stays off unless a local .env asks for it.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api/docs

ai:
  provider: ${AI_PROVIDER:openai}
  # One switch per feature that sends data to the AI provider. Unset follows the edition (AiFeatures): on in
  # TEKNOKENT, off in ODTU, where switching one on stops the startup.
  features:
    profile-parsing: ${AI_PROFILE_PARSING_ENABLED:}
    syllabus: ${AI_SYLLABUS_ENABLED:}
    matching: ${AI_MATCHING_ENABLED:}
    meeting-report: ${AI_MEETING_REPORT_ENABLED:}
    task-handover: ${AI_TASK_HANDOVER_ENABLED:}
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    profile-model: ${OPENAI_MODEL:gpt-4o-mini}
    embedding-model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    base-url: ${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
    profile-model: ${OPENROUTER_MODEL:openai/gpt-4o-mini}
    report-model: ${OPENROUTER_REPORT_MODEL:${OPENROUTER_MODEL:openai/gpt-4o-mini}}
    embedding-model: ${OPENROUTER_EMBEDDING_MODEL:openai/text-embedding-3-small}
    app-name: ${OPENROUTER_APP_NAME:TeamTNT Spring Backend}

app:
  # Which deployment this is: TEKNOKENT (startup mentoring) or ODTU (office hours + İŞKUR). Each edition answers 404
  # for the other one's endpoints and accepts only its own program types. No default: a missing value stops the
  # start-up, so a server that loses the variable never comes up as the other edition.
  edition: ${APP_EDITION:}
  firebase:
    project-id: ${FIREBASE_PROJECT_ID:}
    credentials-json: ${FIREBASE_CREDENTIALS_JSON:}
  institution-login:
    # Local development only: a persona picker stands in for ODTÜ's login. Never on a shared or production server.
    dev-stub: ${INSTITUTION_LOGIN_DEV_STUB:false}
  otg-login:
    # "OTG ile giriş yap" (ODTÜ TEKNOKENT Girişimcilik, OAuth 2.0 + PKCE). Off unless OTG_LOGIN_ENABLED=true; the
    # secret comes only from the environment.
    enabled: ${OTG_LOGIN_ENABLED:false}
    issuer: ${OTG_ISSUER:https://girisimcilik.odtuteknokent.com.tr/auth/v1}
    userinfo-url: ${OTG_USERINFO_URL:https://girisimcilik.odtuteknokent.com.tr/api/oauth/userinfo}
    client-id: ${OTG_CLIENT_ID:}
    client-secret: ${OTG_CLIENT_SECRET:}
    redirect-uri: ${OTG_REDIRECT_URI:}
  cas-login:
    # "ODTÜ ile giriş yap" (ODTÜ's CAS). Off unless CAS_LOGIN_ENABLED=true; then a missing or non-https address
    # stops the start-up. The attribute names are ODTÜ's to tell us (docs/odtu-cas-login.md).
    enabled: ${CAS_LOGIN_ENABLED:false}
    base-url: ${CAS_BASE_URL:}
    service-url: ${CAS_SERVICE_URL:}
    version: ${CAS_VERSION:3.0}
    email-domains: ${CAS_EMAIL_DOMAINS:metu.edu.tr}
    id-attribute: ${CAS_ATTR_ID:}
    email-attribute: ${CAS_ATTR_EMAIL:mail}
    name-attribute: ${CAS_ATTR_NAME:cn}
    kind-attribute: ${CAS_ATTR_KIND:eduPersonAffiliation}
    student-values: ${CAS_KIND_STUDENT:student}
    academic-values: ${CAS_KIND_ACADEMIC:faculty}
    staff-values: ${CAS_KIND_STAFF:staff,employee}
    department-attribute: ${CAS_ATTR_DEPARTMENT:}
    faculty-attribute: ${CAS_ATTR_FACULTY:}
  notifications:
    reminders:
      enabled: ${NOTIFICATION_REMINDERS_ENABLED:true}
      interval-ms: ${NOTIFICATION_REMINDERS_INTERVAL_MS:60000}
  s3:
    # No endpoint: AWS S3, with the AWS region and keys unless the AWS_S3_* ones are set. An endpoint: an
    # S3-compatible store such as MinIO, which only ever gets its own AWS_S3_* keys (S3Properties). The public
    # endpoint is the address presigned links are signed for.
    region: ${AWS_S3_REGION:}
    bucket: ${AWS_S3_BUCKET:}
    endpoint: ${AWS_S3_ENDPOINT:}
    public-endpoint: ${AWS_S3_PUBLIC_ENDPOINT:}
    access-key-id: ${AWS_S3_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_S3_SECRET_ACCESS_KEY:}
    aws-region: ${AWS_REGION:}
    aws-access-key-id: ${AWS_ACCESS_KEY_ID:}
    aws-secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
  peer-training:
    # ODTÜ: the Akran Mentoru training and test run on Prism and a coordinator approves each mentor, so Menton's own
    # quiz stays off and never awards the badge. true brings the in-app quiz (and its automatic badge) back.
    in-app-quiz: ${PEER_TRAINING_IN_APP_QUIZ:false}
    # Only the program's İŞKUR interns can be approved as Akran mentors (default, not yet confirmed by Arya).
    interns-only: ${PEER_TRAINING_INTERNS_ONLY:true}
  registration:
    allowed-email-domains: ${REGISTRATION_ALLOWED_EMAIL_DOMAINS:}
  bootstrap:
    # ROLE:email:firebaseUid,... (ADMIN or COORDINATOR): staff accounts created at startup when missing (StaffBootstrap).
    staff: ${APP_BOOTSTRAP_STAFF:}
  mail:
    # ses (the default, and what an empty value means), smtp, log or off. docs/configuration.md#e-mail
    transport: ${APP_MAIL_TRANSPORT:ses}
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      tls: ${SMTP_TLS:starttls}
      starttls: ${SMTP_STARTTLS:required}
    region: ${AWS_REGION:eu-central-1}
    access-key-id: ${AWS_ACCESS_KEY_ID:}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:}
    from: ${MAIL_FROM:}
    public-url: ${APP_PUBLIC_URL:https://menton.com.tr}
  realtime:
    token-secret: ${REALTIME_TOKEN_SECRET:}
    token-ttl-seconds: ${REALTIME_TOKEN_TTL_SECONDS:60}
    allowed-origins: ${REALTIME_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://menton.com.tr,https://www.menton.com.tr}
    document-ttl-hours: ${REALTIME_DOCUMENT_TTL_HOURS:12}
    seed-lock-seconds: ${REALTIME_SEED_LOCK_SECONDS:30}
  office-hours:
    # Calendar links Moodle subscribes to (FR-OH-23). Off until a deployment turns them on: while off, every link
    # and feed route answers 404.
    calendar-feed:
      enabled: ${OFFICE_HOURS_CALENDAR_FEED_ENABLED:false}
  # Office hours opened from Moodle (LTI 1.3). Empty values leave LTI off; see .env.example.
  lti:
    platform-issuer: ${LTI_PLATFORM_ISSUER:}
    client-id: ${LTI_CLIENT_ID:}
    deployment-ids: ${LTI_DEPLOYMENT_IDS:}
    platform-auth-url: ${LTI_PLATFORM_AUTH_URL:}
    platform-jwks-url: ${LTI_PLATFORM_JWKS_URL:}
    tool-launch-url: ${LTI_TOOL_LAUNCH_URL:}
    tool-private-key: ${LTI_TOOL_PRIVATE_KEY:}
  documents:
    # Same trusted frontend origins as app.realtime.allowed-origins by default.
    # Exact origins only: a pattern such as https://*.amplifyapp.com trusts every Amplify app on the internet.
    allowed-origins: ${DOCUMENTS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,https://menton.com.tr,https://www.menton.com.tr}

profile-parsing:
  ocr:
    executable: ${TESSERACT_EXECUTABLE:tesseract}
    languages: ${TESSERACT_LANGUAGES:tur+eng}
    timeout-seconds: ${TESSERACT_TIMEOUT_SECONDS:45}

matching:
  pgvector:
    # Unset follows AI matching: on in TEKNOKENT, off in ODTU (where switching it on stops the startup).
    enabled: ${MATCHING_PGVECTOR_ENABLED:}

meeting:
  provider:
    # The meeting assistant is optional for local MVP work. Supplying no
    # provider configuration must not prevent the rest of the API from starting.
    base-url: ${MEETING_PROVIDER_BASE_URL:http://localhost}
    api-key: ${MEETING_PROVIDER_API_KEY:}
  transcript-bot:
    enabled: ${MEETING_TRANSCRIPT_BOT_ENABLED:true}
    interval-ms: ${MEETING_TRANSCRIPT_BOT_INTERVAL_MS:30000}
    max-concurrent: ${MEETING_TRANSCRIPT_BOT_MAX_CONCURRENT:3}
