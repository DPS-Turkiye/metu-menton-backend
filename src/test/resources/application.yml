spring:
  profiles:
    active: test
  web:
    locale: tr
  security:
    user:
      name: test
      password: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=true;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  data:
    redis:
      enabled: false

rate-limiting:
  enabled: false
meeting:
  provider:
    base-url: http://localhost
    api-key: test-key
  transcript-bot:
    enabled: false
app:
  notifications:
    reminders:
      enabled: false
  user-deletion:
    cleanup:
      enabled: false
  office-hours:
    expiry:
      enabled: false
  realtime:
    token-secret: test-secret
    allowed-origins: http://localhost:3000
  documents:
    allowed-origins: http://localhost:3000
  s3:
    region: eu-central-1
    bucket: test-bucket
    # An S3-compatible store, as an ODTÜ deployment has: the ODTU edition refuses a bucket on AWS S3 (S3Config).
    # Nothing calls it; the AWS path is covered by S3ConfigTest.
    endpoint: http://localhost:9000
    access-key-id: test
    secret-access-key: test
